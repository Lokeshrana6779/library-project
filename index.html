<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Town Library: Find books and due dates</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<h1>Town Library</h1>
<p class="sub">Search the catalog, borrow a book, and keep track of when it’s due.</p>
<nav role="tablist">
<button role="tab" id="t-find" aria-selected="true">Find books</button>
<button role="tab" id="t-loans" aria-selected="false">My loans<span class="badge" id="lc">0</span></button>
</nav>
<section id="find">
<input class="search" id="q" type="search" placeholder="Search by title, author or subject" aria-label="Search books">
<div class="filters">
<button class="chip" data-f="all" aria-pressed="true">All</button>
<button class="chip" data-f="in" aria-pressed="false">Available now</button>
<button class="chip" data-f="out" aria-pressed="false">On loan</button>
<select id="sub" aria-label="Subject"><option value="">All subjects</option></select>
</div>
<div class="count" id="count"></div>
<div id="results"></div>
</section>
<section id="loans" hidden></section>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
